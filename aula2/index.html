	<script type="text/javascript">
		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};

<div class="slide-content">
  <h2>O que é um <span>Branch</span>?</h2>
  <p style="margin-bottom: 16px;">Toda vez que o código "toma uma decisão".</p>
  <div class="unit-card">
    <p style="margin: 0;"><strong style="color: #00d4ff;">Branch = Ramificação</strong></p>
    <p style="margin: 8px 0 0 0; font-size: 20px !important;">Um <code style="color: #c084fc;">SE</code> gera <strong style="color: #22c55e;">2 branches</strong>: TRUE e FALSE</p>
  </div>
  <div class="code-block" style="font-size: 16px !important;">
    <span class="keyword">SE</span> idade >= <span class="number">18</span> <span class="keyword">ENTÃO</span><br>
    &nbsp;&nbsp;<span class="comment">// Branch 1: TRUE (idade >= 18)</span><br>
    <span class="keyword">SENÃO</span><br>
    &nbsp;&nbsp;<span class="comment">// Branch 2: FALSE (idade < 18)</span><br>
    <span class="keyword">FIM SE</span>
  </div>
  <p class="fragment fade-up" style="margin-top: 12px; font-size: 22px !important;"><strong style="color: #f97316;">Regra:</strong> Se tem decisão, tem branch. Se tem branch, tem que testar os dois lados.</p>
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

<div class="slide-content">
  <h2>O que é um <span>Path</span>?</h2>
  <p style="margin-bottom: 16px;">Um caminho completo de execução do início ao fim.</p>
  <div class="code-block" style="font-size: 16px !important;">

    &nbsp;&nbsp;x = <span class="number">1</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="comment">// início</span><br>

    &nbsp;&nbsp;&nbsp;&nbsp;x = x + <span class="number">1</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="comment">// caminho A</span><br>
    &nbsp;&nbsp;<span class="keyword">SENÃO</span><br>
    &nbsp;&nbsp;&nbsp;&nbsp;x = x - <span class="number">1</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="comment">// caminho B</span><br>
    &nbsp;&nbsp;<span class="keyword">FIM SE</span><br>
    &nbsp;&nbsp;<span class="keyword">RETORNAR</span> x&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="comment">// fim</span><br>
    <span class="keyword">FIM</span>
  </div>
  <div class="unit-card fragment fade-up">
    <p style="margin: 0;"><strong style="color: #00d4ff;">2 paths possíveis:</strong></p>

    <p style="margin: 4px 0 0 0; font-size: 20px !important;">Path B: 1 → x > 0? FALSE → x = 0 → return 0</p>
  </div>
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
